[package]
name = "leakline"
version = "0.1.0"
edition = "2021"
publish = false
description = "Read a Zcash transaction before broadcast and say if the amount would be public."
license = "MIT OR Apache-2.0"

[[bin]]
name = "leakline"
path = "src/main.rs"

[dependencies]
zcash_primitives = { version = "=0.31.0-pre.2", default-features = false, features = ["std"] }
pczt = { version = "=0.10.0-pre.2", default-features = false, features = ["std", "orchard", "sapling", "transparent"] }
zcash_protocol = { version = "=0.11.0-pre.1", default-features = false, features = ["std"] }
hex = "0.4"
